<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./logo.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="public/js/index.js"></script>
    <script src="public/js/nav.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
      html { scroll-behavior: smooth; }
    </style>
    <title>Mfikria Docs</title>
  </head>
  <body style="font-family: 'Poppins', sans-serif" class="bg-white text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-200">
    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-slate-800 relative">
      <div class="mx-auto flex max-w-4xl items-center justify-between px-5 py-4">
        <a href="./index.html" class="font-semibold tracking-tight">Mfikria Docs</a>

        <!-- Navigation -->
        <nav id="header-nav" class="hidden absolute top-full left-0 w-full flex-col gap-4 border-b border-slate-200 bg-white p-5 shadow-lg sm:static sm:flex sm:w-auto sm:flex-row sm:items-center sm:gap-6 sm:border-0 sm:bg-transparent sm:p-0 sm:shadow-none dark:border-slate-800 dark:bg-slate-900">
          <a href="./index.html" class="hover:text-red-600">Home</a>
          <a href="./docs.html" class="hover:text-red-600">Documentation</a>
          <a href="./InputToken.html" class="hover:text-red-600">Access Token</a>
          <a href="./api_tester.html" class="hover:text-red-600">Api Test Tools</a>
          <a href="#contributors" class="hover:text-red-600">Contribution</a>

          <div class="flex items-center gap-6 sm:gap-4 pt-2 sm:pt-0 border-t sm:border-0 border-slate-200 dark:border-slate-800">
            <p onclick="darkmode()" class="flex cursor-pointer dark:hidden"><img src="public/svgs/sun.svg" alt="Mode gelap" class="h-5 w-5" /></p>
            <p onclick="lightmode()" class="hidden cursor-pointer dark:flex"><img src="public/svgs/sun-dark.svg" alt="Mode terang" class="h-5 w-5" /></p>
            <a href="/github" class="flex dark:hidden"><img src="public/svgs/github.svg" alt="GitHub" class="h-5 w-5" /></a>
            <a href="/github" class="hidden dark:flex"><img src="public/svgs/github-dark.svg" alt="GitHub" class="h-5 w-5" /></a>
          </div>
        </nav>

        <!-- Hamburger Button (Mobile Only) -->
        <div class="flex sm:hidden cursor-pointer" onclick="OnclickOpenMenu()" id="open-menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z" clip-rule="evenodd" />
          </svg>
        </div>

        <!-- Close Button (Mobile Only) -->
        <div class="hidden cursor-pointer" onclick="OnclickCloseMenu()" id="close-menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </div>
      </div>
    </header>

    <div class="mx-auto flex max-w-4xl flex-col gap-8 px-5 py-10 md:flex-row md:gap-12">
      <!-- Menu samping: diisi oleh docs.js -->
      <aside class="md:w-44 md:shrink-0">
        <nav id="docs-nav" class="flex gap-5 overflow-x-auto text-sm md:sticky md:top-20 md:flex-col md:gap-3" role="navigation"></nav>
      </aside>

      <!-- Isi dokumentasi: diisi oleh docs.js -->
      <main id="docs-content" class="min-w-0 flex-1 space-y-14"></main>
    </div>

    <footer class="border-t border-slate-200 py-8 text-center text-sm text-slate-500 dark:border-slate-800 dark:text-slate-400">
      Copyright &copy; <span id="year"></span> Mfikria. All rights reserved.
    </footer>

    <!-- Seluruh konten, tab contoh kode, dan tombol salin ada di sini -->
    <script src="public/js/docs.js"></script>
  </body>
</html>
